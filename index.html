    <script>
        // Check if running via file:// protocol
        if (window.location.protocol === 'file:') {
            document.write(`
                <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:#1e293b;color:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;font-family:system-ui,-apple-system,sans-serif;text-align:center;flex-direction:column;padding:20px;">

                    <h1 style="margin:0 0 16px 0;">No abras este archivo directamente</h1>
                    <p style="font-size:18px;max-width:600px;line-height:1.6;color:#cbd5e1;">
                        Por razones de seguridad del navegador (CORS), esta aplicación necesita ejecutarse sobre un servidor local para cargar sus módulos y datos.
                    </p>
                    <div style="background:#0f172a;padding:20px;border-radius:12px;margin-top:30px;border:1px solid #334155;">
                        <p style="margin:0 0 10px 0;font-size:14px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;font-weight:bold;">Solución</p>
                        <p style="margin:0;font-size:20px;">Ejecuta el archivo <span style="color:#60a5fa;font-weight:bold;">start_app.bat</span></p>
                    </div>
                </div>
            `);
            // Stop further execution
            window.stop();
        }
    </script>

                <a href="#" class="nav-item" data-view="market" onclick="window.navigate('market')">

    <script>
        // Register Service Worker for PWA
        // Create a forceful Service Worker unregisterer to clear cache
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
            // Also try to clear caches if possible
            if ('caches' in window) {
                caches.keys().then(function (names) {
                    for (let name of names) caches.delete(name);
                });
            }
        }
    </script>
